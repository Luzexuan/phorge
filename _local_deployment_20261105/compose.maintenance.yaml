    - ./config/phorge/extensions/TeamMaintenanceApplication.php:/opt/phorge/phorge/src/extensions/TeamMaintenanceApplication.php:ro
    - ./config/phorge/organization/20261027.organization.sql:/opt/phorge/phorge/resources/sql/team-organization/20261027.organization.sql:ro
    - ./config/phorge/overrides/AphrontFormPolicyControl.php:/opt/phorge/phorge/src/view/form/control/AphrontFormPolicyControl.php:ro
    - ./config/phorge/extensions/TeamProjectMembership.php:/opt/phorge/phorge/src/extensions/TeamProjectMembership.php:ro
    - ./config/phorge/extensions/TeamProjectMemberImport.php:/opt/phorge/phorge/src/extensions/TeamProjectMemberImport.php:ro
    - ./config/phorge/extensions/TeamProjectTeamPolicy.php:/opt/phorge/phorge/src/extensions/TeamProjectTeamPolicy.php:ro
    - ./config/phorge/overrides/PhabricatorProjectBoardViewController.php:/opt/phorge/phorge/src/applications/project/controller/PhabricatorProjectBoardViewController.php:ro
    - ./config/phorge/overrides/ManiphestEditEngine.php:/opt/phorge/phorge/src/applications/maniphest/editor/ManiphestEditEngine.php:ro
    - ./config/phorge/overrides/PhabricatorManiphestConfigOptions.php:/opt/phorge/phorge/src/applications/maniphest/config/PhabricatorManiphestConfigOptions.php:ro
    - ./config/phorge/overrides/ProjectBoardTaskCard.php:/opt/phorge/phorge/src/applications/project/view/ProjectBoardTaskCard.php:ro
    - ./config/phorge/overrides/PhabricatorPolicyRulesView.php:/opt/phorge/phorge/src/applications/policy/view/PhabricatorPolicyRulesView.php:ro
    - ./config/phorge/overrides/PhabricatorChineseTranslation.php:/opt/phorge/phorge/src/infrastructure/internationalization/translation/PhabricatorChineseTranslation.php:ro
    - ./config/phorge/overrides/PhabricatorPolicyEditController.php:/opt/phorge/phorge/src/applications/policy/controller/PhabricatorPolicyEditController.php:ro
    networks:
      maintenance:
        ipv4_address: 172.30.20.3
      core: {}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - python3
      - -c
      - import urllib.request; urllib.request.urlopen('http://172.30.20.3:8086/healthz',timeout=3)
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '2'
  phorge:
    volumes:
    - ./config/phorge/extensions/TeamPrivateDefaults.php:/opt/phorge/phorge/src/extensions/TeamPrivateDefaults.php:ro
    - ./config/maintenance/keys/php.key:/run/secrets/team-maintenance.key:ro
    networks:
      maintenance:
        ipv4_address: 172.30.20.2
  phorge-daemon:
    volumes:
    - ./config/phorge/extensions/TeamPrivateDefaults.php:/opt/phorge/phorge/src/extensions/TeamPrivateDefaults.php:ro
  phorge-migrate:
    volumes:
    - ./config/phorge/extensions/TeamPrivateDefaults.php:/opt/phorge/phorge/src/extensions/TeamPrivateDefaults.php:ro
networks:
  maintenance:
    internal: true
    ipam:
      config:
      - subnet: 172.30.20.0/24
