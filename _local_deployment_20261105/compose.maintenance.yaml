services:
  maintenance:
    image: team-management/maintenance:e5141c7-v1
    pull_policy: never
    restart: unless-stopped
    user: 10001:10001
    group_add:
    - '33'
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    tmpfs:
    - /tmp:rw,nosuid,nodev,noexec,size=64m
    mem_limit: 256m
    cpus: 0.75
    pids_limit: 96
    stop_signal: SIGTERM
    stop_grace_period: 45s
    environment:
      MAINTENANCE_ROOT: /workspace
      MAINTENANCE_BIND_HOST: 172.30.20.3
      MAINTENANCE_CLIENT_IP: 172.30.20.2
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    volumes:
    - ./config/maintenance/service.py:/workspace/config/maintenance/service.py:ro
    - ./config/maintenance/native.php:/workspace/config/maintenance/native.php:ro
    - ./config/maintenance/keys/service.key:/run/secrets/maintenance.key:ro
    - ./scripts:/workspace/scripts:ro
    - ./config/registration/server.py:/workspace/config/registration/server.py:ro
    - ./config/registration/credential_hashes.py:/workspace/config/registration/credential_hashes.py:ro
    - ./config/warden:/workspace/config/warden
    - ./config/passwords:/workspace/config/passwords
    - ./state/registration:/workspace/state/registration
    - ./state/maintenance:/workspace/state/maintenance
    - phorge-conf:/opt/phorge/phorge/conf/local:ro
    - ./config/phorge/extensions/TeamEntrySessionGuard.php:/opt/phorge/phorge/src/extensions/TeamEntrySessionGuard.php:ro
    - ./config/phorge/extensions/TeamPrivateDefaults.php:/opt/phorge/phorge/src/extensions/TeamPrivateDefaults.php:ro
    - ./config/phorge/overrides/PhabricatorFileQuery.php:/opt/phorge/phorge/src/applications/files/query/PhabricatorFileQuery.php:ro
    - ./config/phorge/overrides/PhabricatorProject.php:/opt/phorge/phorge/src/applications/project/storage/PhabricatorProject.php:ro
    - ./config/phorge/overrides/PhabricatorProjectController.php:/opt/phorge/phorge/src/applications/project/controller/PhabricatorProjectController.php:ro
