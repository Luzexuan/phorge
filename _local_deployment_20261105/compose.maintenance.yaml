    - ./config/phorge/extensions/TeamOrganization.php:/opt/phorge/phorge/src/extensions/TeamOrganization.php:ro
    - ./config/phorge/extensions/TeamOrganizationPolicy.php:/opt/phorge/phorge/src/extensions/TeamOrganizationPolicy.php:ro
